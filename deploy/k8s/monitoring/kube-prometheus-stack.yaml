# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack --version 93.2.0 \
#   -n monitoring --create-namespace -f deploy/k8s/monitoring/kube-prometheus-stack.yaml \
#   --set grafana.adminPassword=<random>        # scripts/up.sh generates it
# Sized to share the 2x t3.medium system nodes. Prometheus storage is
# ephemeral on purpose (throwaway bench env): scripts/bench_swebench.py
# exports the numbers before teardown.

alertmanager:
  enabled: false # nobody to page in a benchmark env

# Managed control planes (EKS) and kind don't expose these to scrape; on
# they only produce permanently-down targets.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors that lack this Helm release's label: ours
    # (servicemonitors.yaml) and the DCGM exporter's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }

grafana:
  resources:
    # 256Mi was OOMKilled on kind: Grafana installs its bundled plugins at boot.
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

kube-state-metrics:
  # Export these node labels as kube_node_labels{label_...} so the dashboard
  # can show Karpenter scaling each pool (incl. GPU to zero) over time.
  metricLabelsAllowlist:
    - nodes=[swe-studio/pool,karpenter.sh/capacity-type,node.kubernetes.io/instance-type]
