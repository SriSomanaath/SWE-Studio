[project]
name = "swe-studio-sdk"
version = "0.1.0"
description = "Push coding-agent trajectories to a local or remote SWE Studio instance."
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "SWE Studio" }]
keywords = ["agent", "coding agent", "observability", "trajectory"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
"Source" = "https://github.com/<your-org>/SWE-Studio"

[project.scripts]
swe-studio = "swe_studio_sdk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["swe_studio_sdk*"]
