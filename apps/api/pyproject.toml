[project]
name = "swe-studio-api"
version = "0.1.0"
description = "SWE Studio FastAPI sidecar — reads studio .traj files and serves them to the Next.js viewer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "watchfiles>=0.24.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies.agent]
# `pip install -e ".[agent]"` enables the in-process LLM-driven agent.
litellm = ["litellm>=1.50.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest_asyncio]
mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
