[project]
name = "swe-studio-api"
version = "0.1.0"
description = "SWE Studio FastAPI sidecar — reads studio .traj files and serves them to the Next.js viewer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "watchfiles>=0.24.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
# `pip install -e ".[agent]"` enables the in-process LLM-driven agent.
# 1.109: per-request enable_prompt_caching (app/agent/llm.py).
# tenacity: litellm needs it for num_retries (429 backoff) but does not depend on it.
agent = ["litellm>=1.109.0", "tenacity>=8.2.0"]
# AGENT_EXECUTOR=k8s: the API creates/reads runner Jobs.
k8s = ["kubernetes>=31.0.0"]
# TRAJECTORIES_BUCKET: mirror ingested trajectories to S3.
s3 = ["boto3>=1.35.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[[tool.mypy.overrides]]
# Optional extras: imported lazily and only when the feature is enabled.
module = ["sentence_transformers", "boto3", "kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest_asyncio]
mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
